[package]
name = "cosmopad-launcher"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CosmoPad V0.1 CosmWasm bonding-curve foundation"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-schema = "2.1.3"
cosmwasm-std = { version = "2.1.3", default-features = false, features = ["std"] }
cw-storage-plus = "2.0.2"
schemars = "0.8.21"
serde = { version = "1.0.203", features = ["derive"] }
thiserror = "1.0.63"

[dev-dependencies]
